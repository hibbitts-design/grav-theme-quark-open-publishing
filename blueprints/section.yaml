title: Section Options
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1

      fields:
        options:
          type: tab

          fields:

            pagetitle:
                type: section
                title: Page Title
                underline: true

            header.hide_page_title:
                type: toggle
                label: Display Title at top of Page
                help: Determines if the page title is displayed at the top of a page
                default: 0
                highlight: 0
                options:
                    0:  Yes
                    1:  No
                validate:
                    type: bool

            reader:
                type: section
                title: Reader Details
                underline: true

            header.section_number:
              type: text
              label: Section Number
              toggleable: true
              placeholder: 'e.g. 1 or 1.2'
              help: 'Optional number shown with the Section Label (e.g. "Chapter 1.2"). Leave empty to use the section''s position.'

            header.section_label:
              type: text
              size: medium
              label: Section Label Override
              toggleable: true
              placeholder: 'e.g. Appendix 1, Introduction, Conclusion'
              help: 'Custom label shown above this section''s title (and its pages). Overrides the Section Label and number set on the Section List or Multi-Section page. Leave empty to hide the label for this section only.'

            header.part:
              type: text
              size: medium
              label: Part
              toggleable: true
              placeholder: 'e.g. Foundations'
              help: 'Optional part title, for a section of a Section List page. Sections in a row with the same Part are grouped under it, with a heading above their cards and a label above them in the side list. Section numbers keep counting across parts.'

            header.learning_objectives:
              type: textarea
              label: Learning Objectives
              toggleable: true
              rows: 5
              placeholder: "- Understand the key concepts\n- Apply the methods described\n- Evaluate the outcomes"
              help: 'Learning objectives displayed at the top of this page as a styled block. Supports Markdown. Can also be added inline using the [objectives] shortcode.'

            card:
                type: section
                title: Card Details
                underline: true

            card_info:
              type: display
              label: false
              markdown: true
              content: 'Shown on this section''s card when it is part of a Section List page.'

            header.description:
              type: textarea
              label: Description
              toggleable: true
              rows: 3
              placeholder: 'A short description for this section'
              help: 'Short description shown on the section card.'

            header.author:
              type: text
              label: Author(s)
              toggleable: true
              placeholder: 'e.g. Jane Smith, Sam Lee'
              help: 'Author name(s) shown on the section card.'

            header.image:
              type: pagemediaselect
              label: Card Image
              toggleable: true
              help: 'Image from this page''s media folder to display on the section card.'

            header.badge_label:
              type: text
              size: small
              label: Badge Label
              toggleable: true
              placeholder: 'e.g. New, Updated, Draft'
              help: 'A short status badge shown on the section card. Leave empty for no badge.'

            header.badge_color:
              type: select
              label: Badge Color
              toggleable: true
              default: default
              options:
                default: Default
                blue: Blue
                green: Green
                yellow: Yellow
                red: Red
                purple: Purple
                plain: Plain
              help: 'The badge colour.'
