title: Git Sync Options
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1

      fields:
        content:
          type: tab

          fields:

            content:
                markdown: true
                default: "Your page content goes here."

        options:
          type: tab

          fields:

            gitsyncoptions:
                type: section
                title: Git Sync Link
                underline: true

            header.hide_git_sync_repo_link:
                type: toggle
                label: Display Git Sync Link
                help: Determines if the Git Repository link is displayed for this page
                default: 0
                highlight: 0
                options:
                    0:  'Yes'
                    1:  'No'
                validate:
                    type: bool

            glossary_section:
              type: section
              title: Glossary
              underline: true

            header.glossary:
              type: list
              label: Glossary
              style: vertical
              collapsed: true
              btnLabel: Add Term
              help: 'Use this page as the guide''s Glossary, instead of a Glossary section: put it in the guide''s folder, like a Topics page, in an unnumbered folder so it isn''t shown as a section card. Only needed on that one page. The terms are listed in alphabetical order at the end of its text (or where you add [glossary]); in the guide''s text, [term]OER[/term] (or the Glossary Term editor button) shows a term''s definition when hovered over, tapped or chosen with the keyboard.'
              fields:
                .term:
                  type: text
                  label: Term
                .definition:
                  type: textarea
                  label: Definition
                  rows: 3

        # Two menu settings on Grav's own Advanced tab, right after its Visible setting (ordering@ places them there)
        advanced:
          fields:
            overrides:
              fields:
                header.hide_from_menu:
                  ordering@: header.visible
                  type: toggle
                  toggleable: true
                  label: Hide from Menu
                  help: 'Leaves this page out of the site menu.'
                  highlight: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                  validate:
                    type: bool
                header.menu_order:
                  ordering@: header.hide_from_menu
                  type: number
                  toggleable: true
                  label: Menu Order
                  size: x-small
                  min: 1
                  help: 'For a page in a guide''s folder without a number (such as Topics): its place in the menu while reading the guide, lowest first.'
                  validate:
                    type: int
